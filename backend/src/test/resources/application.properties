# =======================================================
# HydroAlert Automated Test Configuration
# Uses H2 in-memory database with MySQL compatibility mode
# =======================================================

server.port=8080
spring.application.name=hydroalert-backend-test

# In-memory H2 database for fast, isolated test execution
spring.datasource.url=jdbc:h2:mem:hydroalert_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL Auto for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# HydroAlert Leakage Threshold
hydroalert.leakage-threshold=8.0

# JWT Security Settings for Tests
hydroalert.app.jwtSecret=HydroAlertSuperSecretKeyForJwtSigningCollegeProjectFinalYear2026SecureKey32Bytes!
hydroalert.app.jwtExpirationMs=86400000

# Logging
logging.level.com.hydroalert=WARN
logging.level.org.springframework.security=WARN
