# =======================================================
# HydroAlert Spring Boot Backend - Environment Config
# Supports standard 12-factor application environment variables
# =======================================================

# Server Port (configurable via PORT or SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Application Name
spring.application.name=hydroalert-backend

# =======================================================
# MySQL Database Connection Settings (Environment Injected)
# =======================================================
# Safe environment variable injection. Passwords/URLs are injected via environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hydroalert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# Spring Data JPA & Hibernate Configuration
# =======================================================
# 'update': Automatically creates or updates table schema based on entity definitions
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =======================================================
# JWT (JSON Web Token) Security Settings (Environment Injected)
# =======================================================
# In production, inject JWT_SECRET as a secure environment variable (minimum 32 characters)
hydroalert.app.jwtSecret=${JWT_SECRET:${HYDROALERT_APP_JWTSECRET:HydroAlertWaterLeakageDetectionSecretKey2026SecureJWTKeyCollegeFinalYearProjectSecret}}
hydroalert.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# =======================================================
# HydroAlert Domain Configuration
# =======================================================
# Leakage Threshold (L/min)
hydroalert.leakage-threshold=${LEAKAGE_THRESHOLD:8.0}

# CORS Allowed Origins (React Frontend URL)
hydroalert.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging Configuration
logging.level.com.hydroalert=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
